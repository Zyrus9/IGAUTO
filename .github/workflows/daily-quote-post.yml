name: Daily Quote Post

on:
  schedule:
    # 13:00 UTC = 6:30 PM IST. Adjust to whatever time you want it to post.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, do not post to Instagram)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python bot.py

      - name: Commit generated post record
        run: |
          git config user.name "igauto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ fonts/ || true
          git diff --quiet --cached || git commit -m "Daily quote post $(date -u +'%Y-%m-%d')"
          git push
