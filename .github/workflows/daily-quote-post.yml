name: Daily Quote Post

on:
  schedule:
    # 13:00 UTC = 6:30 PM IST. Adjust to whatever time you want it to post.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, do not post to Instagram)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare today's quote + image
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python bot.py prepare

      - name: Commit and push the generated image
        run: |
          git config user.name "igauto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ fonts/ || true
          git diff --quiet --cached || git commit -m "Prepare daily quote $(date -u +'%Y-%m-%d')"
          git push

      # A short pause so raw.githubusercontent.com has a moment to reflect
      # the file that was just pushed, before Instagram tries to fetch it.
      - name: Wait for raw GitHub URL to propagate
        run: sleep 10

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python bot.py publish

      - name: Commit the Instagram media ID
        run: |
          git add posts/
          git diff --quiet --cached || git commit -m "Record Instagram publish result $(date -u +'%Y-%m-%d')"
          git push
